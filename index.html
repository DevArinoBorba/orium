    <!-- Google FAQ Rich Snippets (FAQPage Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "A Orium Digital atende empresas de quais segmentos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Atendemos empresas de diversos segmentos, principalmente negócios que desejam atrair mais clientes, fortalecer sua presença digital e vender mais por meio de estratégias online."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês fazem apenas tráfego pago?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. A Orium Digital atua de forma completa com tráfego pago, gestão de redes sociais, criativos, sites, landing pages, ecommerce, branding, copywriting, vídeos com IA e estratégias digitais."
            }
          },
          {
            "@type": "Question",
            "name": "As campanhas são feitas no Google Ads e Meta Ads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Trabalhamos com Google Ads, Meta Ads e também TikTok Ads, de acordo com a estratégia ideal para cada negócio."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês criam landing pages para captação de leads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Criamos landing pages modernas, responsivas e focadas em conversão para captar leads qualificados."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona a consultoria gratuita?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A empresa entra em contato pelo WhatsApp, entendemos o momento do negócio e indicamos os melhores caminhos para atrair mais clientes no digital."
            }
          },
          {
            "@type": "Question",
            "name": "A Orium atende empresas de outras cidades?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Atendemos empresas de qualquer cidade de forma online, com comunicação estratégica e acompanhamento personalizado."
            }
          },
          {
            "@type": "Question",
            "name": "Em quanto tempo começo a ter resultados?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Os resultados dependem do segmento, investimento, oferta e estrutura atual da empresa. O foco da Orium é criar uma estratégia consistente, com análise, otimização e evolução contínua."
            }
          }
        ]
      }
